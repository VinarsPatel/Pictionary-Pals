services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      CLIENT_ORIGINS: http://localhost:8080
    volumes:
      - server-data:/app/data
    restart: unless-stopped

  client:
    build:
      context: .
      args:
        REACT_APP_SERVER_URL: http://localhost:4000
        REACT_APP_WS_URL: ws://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
