server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Container/LB health check — bypasses the SPA fallback below.
  location /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # React Router owns client-side routes like /room/:roomID — fall back to
  # index.html for anything that isn't a real static asset.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
